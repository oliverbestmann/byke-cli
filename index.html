<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta name="viewport"
          content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no"/>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: black;
        }

        /* z-index -1 keeps the spinner behind the canvas once the app adds it */
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            z-index: -1;
            width: 48px;
            height: 48px;
            margin: -24px 0 0 -24px;
            box-sizing: border-box;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        canvas {
            display: block;
            touch-action: none;
        }
    </style>
    <script src="wasm_exec.js"></script>
    <script>
        /** @type {WebAssemblyInstantiatedSource} */
        let wasm;

        async function main() {
            const go = new Go();

            // query parameters become environment variables, e.g. ?PUFFIN_ENABLED=1.
            // TinyGo's wasm_exec.js has no env.
            for (const [key, value] of go.env ? new URLSearchParams(location.search) : []) {
                go.env[key] = value;
            }

            WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject).then(async (result) => {
                // TinyGo exports the memory as "memory", the webgpu bindings expect Go's "mem"
                const exports = result.instance.exports;
                wasm = exports.mem ? result : {module: result.module, instance: {exports: {...exports, mem: exports.memory}}};
                await go.run(result.instance);
            });
        }

        void main()
    </script>
</head>
<body>
<div id="loading"></div>
</body>
</html>
